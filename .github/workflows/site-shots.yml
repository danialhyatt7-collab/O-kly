name: Site screenshots
on:
  push:
    branches: [site-shots]
permissions:
  contents: write
jobs:
  shoot:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i playwright@1 && npx playwright install --with-deps chromium
      - run: node tools/shoot.js
      - run: |
          git config user.name "site-shots"
          git config user.email "site-shots@users.noreply.github.com"
          git add shots
          git commit -m "Add screenshots [skip ci]" || echo "nothing to commit"
          git push
